<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#ebe6f6" />

    <script>
      try {
        var t = localStorage.getItem("kom-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
